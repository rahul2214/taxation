<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E214D" />
      <stop offset="50%" stop-color="#081433" />
      <stop offset="100%" stop-color="#030816" />
    </linearGradient>

    <!-- Golden Crest Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#CA8A04" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#9A6B05" />
    </linearGradient>

    <!-- Gold Apex Pyramid Gradient -->
    <linearGradient id="goldApex" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="80%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gold Accent Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="12" />

  <!-- 2. The Signature Polaris "A" Mark -->
  <!-- Left Leg of 'A' -->
  <polygon points="256,76 182,76 102,388 178,388 206,280 256,280" fill="#FFFFFF" />

  <!-- Right Leg of 'A' -->
  <polygon points="256,76 330,76 410,388 334,388 306,280 256,280" fill="#E2E8F0" />

  <!-- The Golden Pyramid / Apex (from Polaris Logo) -->
  <polygon points="256,150 188,388 324,388" fill="url(#goldApex)" filter="url(#goldGlow)" />

  <!-- Golden Horizon Bar -->
  <rect x="156" y="380" width="200" height="14" rx="7" fill="url(#goldBorder)" />

  <!-- Polaris Star Sparkle atop Pyramid -->
  <path d="M 256 128
           Q 256 150 274 150
           Q 256 150 256 172
           Q 256 150 238 150
           Q 256 150 256 128 Z"
        fill="#FFFFFF" />
</svg>
